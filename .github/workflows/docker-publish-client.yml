name: Deploy Client to Dokploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-client
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_ENV=production
            APP_URL=${{ vars.APP_URL }}
            APP_DOMAIN=${{ vars.APP_DOMAIN }}
            SERVER_URL=${{ vars.SERVER_URL }}
            PORT=3001
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: SSanjeevi/dokployaction@v1
        with:
          dokploy-url: ${{ secrets.DOKPLOY_URL }}
          api-key: ${{ secrets.DOKPLOY_API_KEY }}
          application-id: ${{ vars.DOKPLOY_SERVER_APPLICATION_ID }}
          project-name: ${{ vars.DOKPLOY_PROJECT_NAME }}
          environment-name: ${{ vars.DOKPLOY_ENVIRONMENT_NAME }}
          server-name: ${{ vars.DOKPLOY_SERVER_NAME }}
          docker-image: ghcr.io/${{ github.repository }}-server:latest
          registry-url: ghcr.io
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
          enable-health-check: true
          health-check-path: /
          cleanup-old-containers: true